[project]
name = "vietjob-api"
version = "0.1.0"
description = "VietJob Korea AI — job aggregation and AI career matching backend"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ------------------------------------------------------------------
# Ruff — linting + formatting
# ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print — cấm print(), phải dùng logger
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert — cần cho pytest
    "B008",  # function call in default arg — pattern chuẩn của FastAPI Depends()
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
"alembic/env.py" = ["E402"]
# CLI giao tiếp với người dùng qua stdout — print() ở đây là đúng công cụ,
# không phải print-debug sót lại. Ngoại lệ giới hạn đúng thư mục app/cli.
"app/cli/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ------------------------------------------------------------------
# MyPy — static type checking
# ------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["\\.venv", "alembic/versions"]

[[tool.mypy.overrides]]
module = [
    "asyncmy.*",
    "aiomysql.*",
    "pgvector.*",
    "sentence_transformers.*",
    "fakeredis.*",
    "slowapi.*",
    "docx.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ------------------------------------------------------------------
# Pytest
# ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: cần MySQL đang chạy (bỏ qua nếu không kết nối được)",
    "external: gọi mạng ra ngoài (mặc định bị bỏ qua)",
    "slow: chạy lâu",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["*/alembic/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "@overload",
]

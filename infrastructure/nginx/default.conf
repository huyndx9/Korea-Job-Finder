# Nginx phục vụ frontend đã build và proxy API sang backend.
# ⚠️ CHƯA KIỂM CHỨNG cùng với phần Docker còn lại.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nén giúp giảm rõ rệt kích thước bundle JS/CSS.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Các header bảo mật cơ bản.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Asset có hash trong tên nên cache vĩnh viễn được an toàn.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # SPA: mọi đường dẫn không khớp file tĩnh đều trả index.html để
    # React Router tự xử lý phía client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
